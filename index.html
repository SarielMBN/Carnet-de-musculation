/* =========================================================================
   17. VERROUILLAGE FACE ID (version GitHub)
   Face ID passe par WebAuthn : une « clé d'accès » liée à l'appareil, créée une seule fois.
   C'est un verrou d'accès à l'écran : les données elles-mêmes ne sont pas chiffrées.
   ========================================================================= */
const rnd = (n) => crypto.getRandomValues(new Uint8Array(n));
const b64 = (u8) => btoa(String.fromCharCode(...u8));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const sha = async (txt) => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)))].map((b) => b.toString(16).padStart(2, "0")).join("");
const RELOCK_MS = 5 * 60 * 1000;
const Lock = {
  cfg: LS.get("cm2-lock", null), ok: false, hiddenAt: 0, open: false,
  async boot() {
    try { this.ok = !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch { this.ok = false; }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") this.hiddenAt = Date.now();
      else if (this.cfg && !this.open && this.hiddenAt && Date.now() - this.hiddenAt > RELOCK_MS) this.show("welcome", "", true);
    });
    if (UI.view === "reglages") render("none");
  },
  show(mode = "welcome", err = "", auto = false) {
    this.open = true; document.body.style.overflow = "hidden"; Coach.place();
    const h = new Date().getHours(), name = firstName();
    $("#lock-root").innerHTML = `<div class="lock" role="dialog" aria-modal="true" aria-label="Appli verrouillée"><div class="lock-in">
      <div class="big-logo" role="img" aria-label="Hustle"></div>
      <p class="eyebrow">${esc(cap(new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" })))}</p>
      <h1>${h < 18 ? "Bonjour" : "Bonsoir"}${name ? " " + esc(name) : ""}</h1>
      <p class="sub">Déverrouille pour accéder à ton carnet.</p>
      ${mode === "pin"
        ? `<form class="lock-actions" data-submit="lock-pin"><input class="input" id="lock-pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Code de secours" aria-label="Code de secours" style="text-align:center;letter-spacing:.3em">
           <button class="btn btn-block btn-lg" type="submit">Déverrouiller</button><button class="link-light" type="button" data-act="lock-faceid">Utiliser Face ID</button></form>`
        : `<div class="lock-actions"><button class="btn btn-block btn-lg" data-act="lock-faceid">${ic("faceid")}Déverrouiller avec Face ID</button><button class="link-light" data-act="lock-usepin">Utiliser mon code</button></div>`}
      <p class="lock-err" role="alert">${esc(err)}</p>
    </div></div>`;
    if (mode === "pin") setTimeout(() => $("#lock-pin")?.focus(), 50);
    // Tentative automatique à l'ouverture : Safari peut exiger un appui, le bouton reste alors disponible
    if (auto && mode === "welcome") setTimeout(async () => { if (this.open && await this.faceId()) this.hide(); }, 350);
  },
  hide() {
    const el = $(".lock"); this.open = false; document.body.style.overflow = "";
    if (el) { el.classList.add("out"); setTimeout(() => ($("#lock-root").innerHTML = ""), 300); }
    setTimeout(() => Coach.onView(), 400);
  },
  async faceId() {
    try {
      await navigator.credentials.get({ publicKey: { challenge: rnd(32), allowCredentials: [{ type: "public-key", id: unb64(this.cfg.id) }], userVerification: "required", timeout: 60000 } });
      return true;
    } catch { return false; }
  },
  async checkPin(pin) { return (await sha(this.cfg.salt + pin)) === this.cfg.pin; },
  async enable(pin) {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: rnd(32), rp: { name: "Hustle", id: location.hostname },
      user: { id: rnd(16), name: firstName() || "Hustle", displayName: firstName() || "Hustle" },
      pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "preferred" },
      timeout: 60000, attestation: "none" } });
    const salt = b64(rnd(16));
    this.cfg = { id: b64(new Uint8Array(cred.rawId)), salt, pin: await sha(salt + pin) };
    LS.set("cm2-lock", this.cfg);
  },
  disable() { this.cfg = null; LS.del("cm2-lock"); }
};
function lockCardHTML() {
  return `<div class="card"><div class="set-row"><div class="icon-circle">${ic("faceid")}</div>

}

document.addEventListener("touchstart", (ev) => { swipe0 = UI.view === "run" && A && settings().focus && ev.target.closest("#run-list") && !ev.target.closest("input,textarea") ? [ev.touches[0].clientX, ev.touches[0].clientY] : null; }, { passive: true });
document.addEventListener("touchend", (ev) => { if (!swipe0) return; const t = ev.changedTouches[0], dx = t.clientX - swipe0[0], dy = t.clientY - swipe0[1]; swipe0 = null; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) focusGo(dx < 0 ? 1 : -1); }, { passive: true });

/* =========================================================================
   20. DÉMARRAGE
   ========================================================================= */
function onStoreReady() {
  if (!LS.get("cm2-badges-seen", null)) LS.set("cm2-badges-seen", earnedBadges());
  applyTheme();
  if (!Onb.maybe()) render("none");
  Splash.done();
}
Store.boot();
applyTheme(); tickClock();
if (STANDALONE && Lock.cfg) Lock.show("welcome", "", true);
const start = location.hash.slice(1);
UI.view = TABS.some((t) => t[0] === start) ? start : "accueil";
render("none");
setTimeout(() => Splash.done(), 4000); // filet de sécurité si le stockage tarde
if (A) keepAwake();
Store.connect();
if (STANDALONE) {
  Lock.boot();
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.storage?.persist?.().catch(() => {});
}
})();
</script>
